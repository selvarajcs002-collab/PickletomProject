
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PickleOn - Secure Authentication</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Inter', sans-serif;
        background: #000;
        min-height: 100vh;
        margin: 0;
        overflow-x: hidden;
      }
      #root {
        min-height: 100vh;
      }
      ::selection {
        background: #812926;
        color: white;
      }
      
      .bg-gradient-main {
        background: linear-gradient(to right, #812926 0%, #000000 100%);
        background-attachment: fixed;
      }

      /* Transitions */
      .fade-exit {
        opacity: 0;
        transition: opacity 0.5s ease-out;
      }

      /* Animate.css inspired minimal helpers */
      .animate-fade-in { animation: fadeIn 0.8s ease-out forwards; }
      .animate-slide-up { animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
      .animate-stagger-1 { animation-delay: 0.1s; }
      .animate-stagger-2 { animation-delay: 0.2s; }
      .animate-stagger-3 { animation-delay: 0.3s; }

      @keyframes fadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
      }
      @keyframes slideUp {
        from { transform: translateY(20px); opacity: 0; }
        to { transform: translateY(0); opacity: 1; }
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }

      .spinner {
        width: 40px;
        height: 40px;
        border: 3px solid rgba(255, 255, 255, 0.1);
        border-top-color: #ffffff;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
    </style>

        <h1 style="color: white; font-size: 48px; font-weight: 700; letter-spacing: -0.05em; margin-bottom: 24px;">PickleOn</h1>
